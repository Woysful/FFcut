[package]
name = "ffcut-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "FFcut core: typed export settings -> ffmpeg argv, argv <-> editable text, ffprobe, ffmpeg job runner. No UI code."
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25.1"
