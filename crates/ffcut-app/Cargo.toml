[package]
name = "ffcut-app"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "ffcut_app"
path = "src/lib.rs"

[[bin]]
name = "ffcut"
path = "src/main.rs"

[dependencies]
ffcut-core = { path = "../ffcut-core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_glow = "0.36"
libmpv2 = "6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# same winit as eframe uses (0.30.x): needed to choose X11 / Wayland explicitly
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
